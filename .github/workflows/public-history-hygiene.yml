name: Public History Hygiene

# Reusable pre-merge gate that blocks private assistant-session references
# before publication. It is validation-only and never rewrites timestamps,
# authors, committers, attribution, or Git history.
#
# Internal tracker references are scoped by whether the text becomes a commit
# message: allowed in commit messages, the PR title, and the PR body; still
# rejected in added source content and branch names.
#
# Consume from another repo:
#   jobs:
#     hygiene:
#       uses: kinlab-ai/kin-actions/.github/workflows/public-history-hygiene.yml@v0.1.22
#
# A repository adopting the gate for the first time can consume it with
# `scan-history: false`, which checks the pull request title and body alone.
# That is the surface a merge queue mints the squash commit message from, and
# it is the surface a local Git hook cannot reach, because the mint happens
# server-side after every hook has already run.
#
# The scan range is resolved from the caller's event, so a caller whose own
# workflow adds a `merge_group:` trigger gets the queued range scanned with no
# extra inputs. This workflow itself stays workflow_call-only; the caller's
# triggers decide when it runs.
on:
  workflow_call:
    inputs:
      check-timestamps:
        # Deprecated compatibility input. It is ignored. Commit timestamps are
        # preserved and are never treated as a policy violation.
        required: false
        type: boolean
        default: false
      content-excludes:
        # Extra space-separated globs excluded from added-line content scanning.
        required: false
        type: string
        default: ""
      scan-history:
        # When false the gate runs as the pre-submit mint check alone: the pull
        # request title and body, read from the event payload, with no checkout
        # of the caller's code and no commit, content, or branch rules. That is
        # the whole of the leak surface a merge queue mints from, so a repository
        # can adopt the gate there first and turn history scanning on separately.
        required: false
        type: boolean
        default: true
      kin-actions-ref:
        # Deprecated and ignored. Helper bytes are the exact called-workflow
        # commit from job.workflow_repository/job.workflow_sha.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  hygiene:
    name: Public-history hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: inputs.scan-history
        with:
          fetch-depth: 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Scan for private metadata
        env:
          # All event-derived values (PR title, branch, SHAs) are read via env
          # and passed as quoted argv -- never interpolated into the shell.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          CONTENT_EXCLUDES: ${{ inputs.content-excludes }}
          SCAN_HISTORY: ${{ inputs.scan-history }}
        run: |
          set -euo pipefail
          if [ "$SCAN_HISTORY" != "true" ]; then
            # Pre-submit mint check only. No caller checkout exists in this
            # mode, so the scanner must reach no Git repository: the title and
            # body come from the event payload as quoted argv. The branch name
            # is deliberately left out -- it is not minted into any commit
            # message, and its rule belongs with history scanning.
            python3 .kin-actions/scripts/history-hygiene.py \
              --no-commits --no-content \
              --title "$PR_TITLE" --body "$PR_BODY"
            exit 0
          fi
          base=""
          head="HEAD"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Without an explicit range a merge group would fall through to the
            # single-commit default and scan only the queue's merge commit,
            # whose combined diff is empty for a clean merge. The gate would
            # then report success having inspected none of the queued change.
            base="$MERGE_GROUP_BASE_SHA"
            head="$MERGE_GROUP_HEAD_SHA"
          fi
          args=(--base "$base" --head "$head" --branch "$PR_HEAD_REF" --title "$PR_TITLE")
          # The body is the squash commit message on a queue-managed repo, so it
          # is scanned at pull-request time. Only the pull_request event carries
          # one; on merge_group the same text is already in range as the minted
          # squash commit, and on push there is no pull request at all.
          args+=(--body "$PR_BODY")
          for g in $CONTENT_EXCLUDES; do args+=(--content-exclude "$g"); done
          python3 .kin-actions/scripts/history-hygiene.py "${args[@]}"
