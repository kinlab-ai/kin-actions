name: Cargo Dependency Wave

on:
  workflow_call:
    inputs:
      manifests:
        required: false
        type: string
        default: Cargo.toml
      test-command:
        required: false
        type: string
        default: cargo test
      watched-crates:
        required: false
        type: string
        default: kin-blobs kin-vector kin-infer kin-search kin-model kin-db kin-lsp kin-vfs-core
      labels:
        # Descriptive/authentication metadata applied to every consumer-bump
        # PR; it never selects automatic release intent. Callers may
        # extend/override, and `proof-impacting` is appended automatically.
        required: false
        type: string
        default: release:consumer-bump
      proof-impacting-crates:
        # A bump of any crate in this set can move benchmark/proof results, so its
        # PR also carries the `proof-impacting` label for reviewer routing.
        required: false
        type: string
        default: kin-blobs kin-vector kin-infer kin-search kin-model kin-db kin-ranking
      bump-own-version:
        # A dependency-pin change trips the version gate, so the wave bumps the
        # consumer's own patch version by default. Repos whose own version moves
        # through a separate process opt out: kin's release version spans five
        # files in lockstep, so a single-file bump there is a hazard, not help.
        required: false
        type: boolean
        default: true
      version-mode:
        # `train` means the consumer's own release train owns version movement.
        # It therefore requires bump-own-version=false and the release App;
        # mutable workflow labels and the default Actions token have no write
        # authority in that mode.
        required: false
        type: string
        default: manual
      release-environment:
        # Train callers bind App credentials through this protected,
        # default-branch-only environment.
        required: false
        type: string
        default: registry-publish
      refresh-all-on-event:
        # Deprecated compatibility input. Every run now refreshes the complete
        # watched set because GitHub retains only one pending run per
        # concurrency group; event-only refresh can lose a distinct crate
        # release when a newer pending run replaces it.
        required: false
        type: boolean
        default: true
      reviewers:
        # Comma-separated logins to request as reviewers on the bump PR. Gated
        # repos set the founder here so the PR lands in the native GitHub
        # review-requests queue and notifies; auto-merge repos leave it empty,
        # since requesting review on a PR that merges itself is noise. GitHub
        # rejects a request naming the PR author, so leave empty for PRs the
        # same account opens.
        required: false
        type: string
        default: ""
      auto-merge:
        # Arm GitHub auto-merge on the bump PR so it lands the moment every
        # required check passes. Requires allow_auto_merge on the repo. Leaf
        # libraries opt in; gated repos leave this off and merge through an
        # explicit approval instead.
        required: false
        type: boolean
        default: false
      report-only:
        # Dry-run: resolve and report the pins that WOULD change without writing
        # manifests or opening a PR. Lets an operator inspect the dependency graph
        # safely (surface it through a caller's workflow_dispatch input).
        required: false
        type: boolean
        default: false
      kin-actions-ref:
        # Deprecated and ignored. Helper bytes are the exact called-workflow
        # commit from job.workflow_repository/job.workflow_sha.
        required: false
        type: string
        default: ""
    secrets:
      KIN_CI_BOT_TOKEN:
        required: false
      KIN_RELEASE_BOT_APP_ID:
        required: false
      KIN_RELEASE_BOT_PRIVATE_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write

# Repository-dispatch delivery is at-least-once, while GitHub retains only one
# pending run per concurrency group. Every surviving run therefore refreshes
# the complete watched set from strict registry authority. That makes replacement
# of one pending event safe and also lets a later run rebuild the shared
# automation branch while an earlier PR is still unmerged.
concurrency:
  group: kin-dependency-wave-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  KINLAB_CARGO_REGISTRY_URL: https://kinlab.ai

jobs:
  dependency_wave:
    name: Update Kin registry dependency pins
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment }}
    env:
      HAVE_RELEASE_APP: >-
        ${{ secrets.KIN_RELEASE_BOT_APP_ID != '' &&
            secrets.KIN_RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Enforce automatic train authority
        env:
          VERSION_MODE: ${{ inputs.version-mode }}
          BUMP_OWN_VERSION: ${{ inputs.bump-own-version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$VERSION_MODE" in
            manual|train) ;;
            *)
              echo "::error::version-mode must be manual or train"
              exit 1
              ;;
          esac
          if [[ "$VERSION_MODE" == "train" ]]; then
            if [[ "$BUMP_OWN_VERSION" != "false" ]]; then
              echo "::error::train-mode dependency waves require bump-own-version=false"
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "::error::train-mode dependency waves run only from protected ${DEFAULT_BRANCH}"
              exit 1
            fi
            if [[ "$HAVE_RELEASE_APP" != "true" ]]; then
              echo "::error::${{ inputs.release-environment }} must provide KIN_RELEASE_BOT_APP_ID and KIN_RELEASE_BOT_PRIVATE_KEY"
              exit 1
            fi
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kin-actions
          persist-credentials: false
      - name: Mint repository-scoped release token
        id: release_app
        if: env.HAVE_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KIN_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KIN_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Prove automatic-release admission settings
        if: inputs.version-mode == 'train'
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}" \
            > "$RUNNER_TEMP/repository-settings.json"
          # Strict/up-to-date admission is absent from the Contents-only branch
          # summary. The exact-repository release App therefore receives
          # Administration(read), never write, for this dedicated readback.
          gh api \
            "repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}/protection/required_status_checks" \
            > "$RUNNER_TEMP/required-status-checks.json"
          python3 .kin-actions/scripts/check-release-activation.py \
            --repository-settings "$RUNNER_TEMP/repository-settings.json" \
            --status-checks "$RUNNER_TEMP/required-status-checks.json" \
            --required-context "release / Version bump gate" \
            --required-context "release / Registry-only build" \
            --required-context "release / Repo verification" \
            --required-check-app-id 15368
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          # Tolerated for the reason upstream tolerated it: on a runner whose rustup
          # already carries a default, re-defaulting can fail while the toolchain is
          # installed and usable.
          rustup default 1.96.0 || true
          echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}" >> "$GITHUB_ENV"
          echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR:-always}" >> "$GITHUB_ENV"
      - name: Require the minted App token in train mode
        if: inputs.version-mode == 'train'
        env:
          RELEASE_APP_TOKEN: ${{ steps.release_app.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_APP_TOKEN" ]]; then
            echo "::error::train mode refuses PAT and GITHUB_TOKEN fallback"
            exit 1
          fi
      - name: Configure Kin registry
        run: |
          cargo_home="$RUNNER_TEMP/kin-cargo-home"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          mkdir -p "$cargo_home"
          touch "$cargo_home/config.toml"
          if ! grep -q '^\[registries\.kin\]' "$cargo_home/config.toml"; then
            cat >> "$cargo_home/config.toml" <<'TOML'

          [registries.kin]
          index = "sparse+https://kinlab.ai/registry/cargo/"
          TOML
          fi
      - name: Update Cargo manifests
        id: update
        env:
          EVENT_CRATE: ${{ github.event.client_payload.crate_name }}
          EVENT_VERSION: ${{ github.event.client_payload.crate_version }}
          MANIFESTS: ${{ inputs.manifests }}
          WATCHED: ${{ inputs.watched-crates }}
          PROOF_CRATES: ${{ inputs.proof-impacting-crates }}
          BASE_LABELS: ${{ inputs.labels }}
          REPORT_ONLY: ${{ inputs.report-only }}
        run: |
          args=()
          for m in $MANIFESTS; do args+=(--manifest "$m"); done
          dry=()
          if [[ "$REPORT_ONLY" == "true" ]]; then dry+=(--dry-run); fi
          proof=false
          note_proof() {
            for pc in $PROOF_CRATES; do
              if [[ "$pc" == "$1" ]]; then proof=true; fi
            done
            return 0
          }
          run_update() {
            local out result reason
            out="$(python3 .kin-actions/scripts/update-cargo-registry-deps.py "$@" 2>&1)"
            result=$?
            printf '%s\n' "$out"
            case "$result" in
              0|2) return "$result" ;;
              3)
                # Status 3 is a blocked roll: cargo refused because another
                # package requires the version this wave is moving off. That is
                # a fact about the dependency graph, not broken automation, and
                # a scheduled run that keeps going red has to say which one it
                # is. Read the value rather than the pipeline status, because a
                # pipeline reports its last stage and `sed` finding nothing
                # still exits clean.
                reason="$(printf '%s\n' "$out" \
                  | sed -n 's/^dependency wave blocked: //p' | head -1)"
                if [[ -z "$reason" ]]; then
                  echo "::error::dependency updater reported a blocked roll without a reason line; treating it as a hard failure"
                  exit 1
                fi
                {
                  echo "### Kin dependency wave blocked"
                  echo
                  echo "The registry pins cannot move yet:"
                  echo
                  echo "> $reason"
                  echo
                  echo "This workflow is working. The roll needs the blocking requirement"
                  echo "to move first, and then the wave advances on its own."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::error title=Kin dependency wave blocked::$reason"
                exit 3
                ;;
              4)
                # Status 4: the Kin registry kept answering HTTP 5xx after the
                # updater's retries. That is an outage, not a pin decision, so
                # report it and end without a PR or a red run. The next
                # scheduled wave tries again.
                reason="$(printf '%s\n' "$out" \
                  | sed -n 's/^dependency wave skipped: registry unavailable: //p' | head -1)"
                {
                  echo "### Kin registry unavailable"
                  echo
                  echo "> ${reason:-the registry answered HTTP 5xx after every retry}"
                  echo
                  echo "No pins were judged and no PR was opened. The next wave retries."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::warning title=Kin registry unavailable::${reason:-registry answered HTTP 5xx after every retry}; dependency wave skipped"
                return 4
                ;;
              *)
                echo "::error::dependency updater failed with exit code $result; aborting without a PR"
                exit "$result"
                ;;
            esac
          }
          title="refresh Kin registry dependency pins"
          crate_args=()
          for crate in $WATCHED; do
            crate_args+=(--crate "$crate")
          done
          if [[ -n "${EVENT_CRATE:-}" && -n "${EVENT_VERSION:-}" ]]; then
            # Preserve an event version that is ahead of a briefly stale index,
            # but never narrow the transaction to that event alone. The updater
            # rejects the event floor if that exact registry row is yanked.
            crate_args+=(
              --crate "$EVENT_CRATE"
              --event-crate "$EVENT_CRATE"
              --version "$EVENT_VERSION"
            )
            title="refresh Kin registry pins after $EVENT_CRATE@$EVENT_VERSION"
          fi
          set +e
          run_update "${crate_args[@]}" "${dry[@]}" "${args[@]}"
          code=$?
          set -e
          if [[ "$code" == "0" ]]; then
            # The updater plans and applies the watched set as one
            # transaction. Conservatively route review if any requested
            # crate is proof-impacting.
            for crate in $WATCHED; do note_proof "$crate"; done
            if [[ -n "${EVENT_CRATE:-}" ]]; then note_proof "$EVENT_CRATE"; fi
          fi
          # report-only never opens a PR, even when pins would change.
          if [[ "$code" == "0" && "$REPORT_ONLY" != "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          labels="$BASE_LABELS"
          if [[ "$proof" == "true" ]]; then
            labels="${labels:+$labels,}proof-impacting"
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          if [[ "$REPORT_ONLY" == "true" ]]; then
            echo "::notice::report-only dependency wave: reported pins that would change; no PR opened."
          fi
      - name: Bump own version so the PR can pass the version gate
        if: steps.update.outputs.changed == 'true' && inputs.bump-own-version
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          set -euo pipefail
          # The gate sets require_bump from dep_manifest_changes alone, so a PR
          # that only moves dependency pins still has to move its own version.
          # Without this the wave opens a PR that fails a gate it triggered.
          #
          # A workspace member manifest can carry `version.workspace = true`
          # (kin-db's does), in which case the crate's own version lives in the
          # ROOT manifest's [workspace.package]. When every listed manifest has
          # no own version to move, bump the root instead of silently skipping.
          handled=0
          for m in $MANIFESTS; do
            out="$(python3 .kin-actions/scripts/bump-own-version.py --manifest "$m")"
            printf '%s\n' "$out"
            case "$out" in *"nothing to bump"*) ;; *) handled=1;; esac
          done
          if [ "$handled" = "0" ] && [ -f Cargo.toml ]; then
            python3 .kin-actions/scripts/bump-own-version.py --manifest Cargo.toml
          fi

      - name: Resynchronize Cargo.lock with the bumped own version
        if: steps.update.outputs.changed == 'true' && inputs.bump-own-version
        run: |
          set -euo pipefail
          # The bump rewrites the manifest's own version and never touches
          # Cargo.lock, so the lock still names every workspace member at the
          # previous version. The snapshot below would freeze that inconsistent
          # pair, the caller's test command would then resolve and rewrite those
          # lock entries, and the admission gate would refuse the tree it had
          # just generated. Sync here so the snapshot is already a fixed point
          # under any resolve the test command performs.
          #
          # Only workspace members move: `--workspace` restricts the update to
          # them and leaves every dependency selection the updater made intact.
          # A repo that does not track Cargo.lock has nothing to sync, and
          # creating one there would leave an untracked file the admission gate
          # is right to reject.
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            cargo update --workspace
          else
            echo "Cargo.lock is not tracked; nothing to resynchronize"
          fi

      - name: Snapshot the exact generated dependency delta
        id: generated
        if: steps.update.outputs.changed == 'true'
        env:
          MANIFESTS: ${{ inputs.manifests }}
          VERSION_MODE: ${{ inputs.version-mode }}
          BUMP_OWN_VERSION: ${{ inputs.bump-own-version }}
          KIN_ACTIONS_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          args=()
          for manifest in $MANIFESTS; do
            args+=(--manifest "$manifest")
          done
          validator="$RUNNER_TEMP/validate-dependency-wave-generated.py"
          git -C .kin-actions show \
            "${KIN_ACTIONS_SHA}:scripts/validate-dependency-wave.py" \
            > "$validator"
          generated="$(
            python3 "$validator" \
              "${args[@]}" \
              --version-mode "$VERSION_MODE" \
              --bump-own-version "$BUMP_OWN_VERSION" \
              --ephemeral-path .kin-actions
          )"
          echo "expected_tree=$(jq -r .tree <<<"$generated")" \
            >> "$GITHUB_OUTPUT"

      - name: Run verification
        if: steps.update.outputs.changed == 'true'
        run: ${{ inputs.test-command }}
      - name: Admit the exact generated dependency delta
        id: admission
        if: steps.update.outputs.changed == 'true'
        env:
          MANIFESTS: ${{ inputs.manifests }}
          VERSION_MODE: ${{ inputs.version-mode }}
          BUMP_OWN_VERSION: ${{ inputs.bump-own-version }}
          KIN_ACTIONS_SHA: ${{ job.workflow_sha }}
          EXPECTED_TREE: ${{ steps.generated.outputs.expected_tree }}
        run: |
          set -euo pipefail
          args=()
          for manifest in $MANIFESTS; do
            args+=(--manifest "$manifest")
          done
          # The caller-controlled test command ran immediately before this
          # gate. Reconstruct the validator from the exact called-workflow
          # commit object rather than trusting its mutable checkout bytes.
          validator="$RUNNER_TEMP/validate-dependency-wave.py"
          git -C .kin-actions show \
            "${KIN_ACTIONS_SHA}:scripts/validate-dependency-wave.py" \
            > "$validator"
          admission="$(
            python3 "$validator" \
              "${args[@]}" \
              --version-mode "$VERSION_MODE" \
              --bump-own-version "$BUMP_OWN_VERSION" \
              --expected-tree "$EXPECTED_TREE" \
              --ephemeral-path .kin-actions
          )"
          {
            echo "expected_tree=$(jq -r .tree <<<"$admission")"
            echo "add_paths<<KIN_PATHS"
            jq -r '.paths[]' <<<"$admission"
            echo "KIN_PATHS"
          } >> "$GITHUB_OUTPUT"
      - name: Clean helper checkout
        if: always()
        run: rm -rf .kin-actions
      - name: Ensure dependency-wave labels exist
        # Best-effort: GitHub's add-labels API rejects unknown labels, so create
        # them idempotently first. Never block the bump PR on label provisioning.
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: >-
            ${{ steps.release_app.outputs.token ||
                secrets.KIN_CI_BOT_TOKEN || github.token }}
          LABELS: ${{ steps.update.outputs.labels }}
        run: |
          IFS=',' read -ra names <<< "$LABELS"
          for raw in "${names[@]}"; do
            name="$(echo "$raw" | xargs)"
            if [[ -z "$name" ]]; then continue; fi
            gh label create "$name" --force \
              --color ededed \
              --description "Kin release automation"
          done
      - name: Open dependency bump PR
        id: open_pr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: >-
            ${{ steps.release_app.outputs.token ||
                secrets.KIN_CI_BOT_TOKEN || github.token }}
          branch: automation/kin-registry-dependency-wave
          add-paths: ${{ steps.admission.outputs.add_paths }}
          delete-branch: true
          signoff: true
          labels: ${{ steps.update.outputs.labels }}
          # Attribute server-created dependency commits to the automation that
          # creates them. This is truthful provenance, not a timestamp exemption.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          reviewers: ${{ inputs.reviewers }}
          commit-message: "chore(deps): ${{ steps.update.outputs.title }}"
          title: "chore(deps): ${{ steps.update.outputs.title }}"
          body: |
            Automated Kin registry dependency wave.

            This PR updates Cargo registry dependency pins after a verified Kin registry publish and runs the repo smoke command before opening the PR.

      - name: Verify exact first-party generated PR
        id: verify_pr
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: >-
            ${{ steps.release_app.outputs.token ||
                secrets.KIN_CI_BOT_TOKEN || github.token }}
          PR: ${{ steps.open_pr.outputs.pull-request-number }}
          ACTION_HEAD: ${{ steps.open_pr.outputs.pull-request-head-sha }}
          EXPECTED_TREE: ${{ steps.admission.outputs.expected_tree }}
          EXPECTED_BRANCH: automation/kin-registry-dependency-wave
          EXPECTED_BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::dependency action did not return one PR number"
            exit 1
          fi
          if [[ ! "$ACTION_HEAD" =~ ^[0-9a-f]{40}$ ||
                ! "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::dependency action/admission returned an invalid object ID"
            exit 1
          fi
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")"
          api_head="$(jq -r .head.sha <<<"$pull")"
          if [[ "$(jq -r .state <<<"$pull")" != "open" ||
                "$(jq -r .head.repo.full_name <<<"$pull")" != "$GITHUB_REPOSITORY" ||
                "$(jq -r .head.ref <<<"$pull")" != "$EXPECTED_BRANCH" ||
                "$(jq -r .base.ref <<<"$pull")" != "$EXPECTED_BASE" ]]; then
            echo "::error::dependency PR is not the exact first-party automation branch"
            exit 1
          fi
          if [[ "$api_head" != "$ACTION_HEAD" ]]; then
            echo "::error::dependency PR moved from generated ${ACTION_HEAD} to ${api_head}"
            exit 1
          fi
          api_tree="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/commits/${api_head}" \
              --jq .tree.sha
          )"
          if [[ "$api_tree" != "$EXPECTED_TREE" ]]; then
            echo "::error::dependency PR tree ${api_tree} differs from admitted ${EXPECTED_TREE}"
            exit 1
          fi
          echo "head_sha=$api_head" >> "$GITHUB_OUTPUT"

      - name: Arm auto-merge on the bump PR
        if: >-
          inputs.auto-merge && steps.update.outputs.changed == 'true' &&
          steps.verify_pr.outputs.head_sha != ''
        env:
          GH_TOKEN: >-
            ${{ steps.release_app.outputs.token ||
                secrets.KIN_CI_BOT_TOKEN || github.token }}
          PR: ${{ steps.open_pr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.verify_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # --auto defers the merge to GitHub until every required check passes;
          # nothing lands early, and a failed gate leaves the PR open.
          gh pr merge --squash --auto "$PR" \
            --repo "$GITHUB_REPOSITORY" \
            --match-head-commit "$PR_HEAD"
